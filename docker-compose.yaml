services:
  fastapi:
    image: ekene4321/fastapi:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
  
  streamlit:
    image: ekene4321/streamlittest:dev
    build:
      context: streamlit_app/
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi:8000

 
