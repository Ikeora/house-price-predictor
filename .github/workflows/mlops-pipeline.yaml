            --mlflow-tracking-uri http://localhost:5555
        
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
      
      - name: Cleaning up MLflow
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server  || true
          
  build_and_publish: # FIXED INDENTATION HERE
    needs: model_training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      
      - name: Download preprocessor
        uses: actions/download-artifact@v4
        with:
          name: preprocessor
          path: models/trained/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 1. BUILD & TEST FASTAPI MODEL
      - name: Build and test Model Docker image
        run: |
          COMMIT_HASH=$(echo ${{github.sha}} | cut -c1-7)
          docker build -t docker.io/${{ vars.DOCKERHUB_USERNAME}}/house-price-model:$COMMIT_HASH -f Dockerfile .
          docker run -d -p 8000:8000 --name test-api docker.io/${{ vars.DOCKERHUB_USERNAME}}/house-price-model:$COMMIT_HASH
          for i in {1..5}; do
            curl -f http://localhost:8000/health && break || sleep 5;
          done
          docker logs test-api
      
      # 2. BUILD & TEST STREAMLIT FRONTEND
      - name: Build and test Streamlit Docker image
        run: |
          COMMIT_HASH=$(echo ${{github.sha}} | cut -c1-7)
          docker build -t docker.io/${{ vars.DOCKERHUB_USERNAME}}/streamlit:$COMMIT_HASH -f streamlit_app/Dockerfile ./streamlit_app
          docker run -d -p 8501:8501 --name test-ui docker.io/${{ vars.DOCKERHUB_USERNAME}}/streamlit:$COMMIT_HASH
          for i in {1..5}; do
            curl -f http://localhost:8501/ && break || sleep 5;
          done
          docker logs test-ui

      # 3. CLEAN UP BOTH TEST CONTAINERS
      - name: Clean up test containers
        run: |
          docker stop test-api test-ui || true
          docker rm test-api test-ui || true  
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. PUSH BOTH IMAGES TO DOCKER HUB
      - name: Push Docker images to Docker Hub
        run: |
          COMMIT_HASH=$(echo ${{github.sha}} | cut -c1-7)
          
          # Push Model images
          docker tag docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH docker.io/${{ vars.DOCKERHUB_USERNAME}}/house-price-model:latest
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:latest
          
          # Push Streamlit images
          docker tag docker.io/${{ vars.DOCKERHUB_USERNAME }}/streamlit:$COMMIT_HASH docker.io/${{ vars.DOCKERHUB_USERNAME}}/streamlit:latest
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/streamlit:$COMMIT_HASH
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/streamlit:latest

      # 5. NOW UPDATE MANIFESTS
      - name: Update Kubernetes Manifests and Push to Git
        run: |
          COMMIT_HASH=$(echo ${{github.sha}} | cut -c1-7)
          
          sed -i "s|image: ekene4321/house-price-model:.*|image: ekene4321/house-price-model:$COMMIT_HASH|g" model-deploy.yaml
          sed -i "s|image: ekene4321/streamlit:.*|image: ekene4321/streamlit:$COMMIT_HASH|g" streamlit_deploy.yaml
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add model-deploy.yaml streamlit_deploy.yaml
          git commit -m "chore: automated backend/frontend deployment to $COMMIT_HASH [skip ci]"
          git push

